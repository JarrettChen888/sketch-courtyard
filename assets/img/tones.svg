<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-labelledby="t6">
  <title id="t6">示意图：球体被光分成高光、亮部、明暗交界线、反光和投影五个部分，上方是从浅到深的调子条</title>
  <rect width="640" height="460" fill="#FBF6EC"/>
  <defs>
    <pattern id="band1" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><line x1="0" y1="0" x2="0" y2="7" stroke="#6B6055" stroke-width="1" opacity=".22"/></pattern>
    <pattern id="band2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><line x1="0" y1="0" x2="0" y2="6" stroke="#6B6055" stroke-width="1" opacity=".38"/></pattern>
    <pattern id="band3" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><line x1="0" y1="0" x2="0" y2="5" stroke="#4A423A" stroke-width="1.1" opacity=".5"/></pattern>
    <pattern id="band4" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><line x1="0" y1="0" x2="0" y2="4" stroke="#2B2622" stroke-width="1.1" opacity=".62"/></pattern>
    <clipPath id="castShadow"><ellipse cx="404" cy="390" rx="118" ry="19"/></clipPath>
  </defs>

  <!-- 调子条 -->
  <g>
    <text x="56" y="42" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#7A6E61">调子条：从最浅到最黑，练习一层层叠</text>
    <g stroke="#8B7B66" stroke-width="1.2">
      <rect x="56" y="58" width="78" height="42" fill="#FBF6EC"/>
      <rect x="134" y="58" width="78" height="42" fill="url(#band1)"/>
      <rect x="212" y="58" width="78" height="42" fill="url(#band2)"/>
      <rect x="290" y="58" width="78" height="42" fill="url(#band3)"/>
      <rect x="368" y="58" width="78" height="42" fill="url(#band4)"/>
      <rect x="446" y="58" width="78" height="42" fill="#2B2622"/>
    </g>
    <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#8B7B66">
      <text x="72" y="118">最浅</text>
      <text x="468" y="118">最黑</text>
    </g>
  </g>

  <!-- 光 -->
  <g>
    <path d="M100 230 L172 300" fill="none" stroke="#C8B48C" stroke-width="1.6" stroke-dasharray="4 4"/>
    <path d="M160 292 L172 300 L158 302" fill="none" stroke="#C8B48C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="218" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#7A6E61">光</text>
  </g>

  <!-- 球 -->
  <circle cx="310" cy="262" r="108" fill="#FFFDF8" stroke="#3B342C" stroke-width="2.4"/>
  <!-- 亮部与高光 -->
  <circle cx="252" cy="212" r="15" fill="#FBF6EC"/>
  <path d="M262 198 C292 182 330 186 356 204" fill="none" stroke="#D8C8AB" stroke-width="1.2"/>
  <!-- 暗面 -->
  <g fill="none" stroke="#5E5449" stroke-width="1.2" opacity=".72" stroke-linecap="round">
    <path d="M370 172 C404 198 418 232 414 266"/>
    <path d="M380 188 C412 214 424 246 420 278"/>
    <path d="M384 210 C414 236 426 268 420 298"/>
    <path d="M380 234 C408 260 418 290 412 318"/>
    <path d="M366 258 C392 284 400 310 394 330"/>
    <path d="M346 278 C368 302 376 322 370 340"/>
    <path d="M320 292 C340 312 346 330 340 348"/>
    <path d="M292 298 C310 316 314 332 308 350"/>
    <path d="M262 300 C278 316 282 332 278 348"/>
    <path d="M232 292 C248 308 252 324 246 340"/>
    <path d="M208 276 C222 292 226 308 222 322"/>
    <path d="M196 252 C210 266 214 282 210 296"/>
  </g>
  <!-- 明暗交界线 -->
  <path d="M226 332 C300 366 372 332 402 262 C414 232 410 196 392 168" fill="none" stroke="#8B7B66" stroke-width="1.6" stroke-dasharray="5 5" opacity=".85"/>
  <!-- 反光 -->
  <path d="M200 292 C228 322 268 340 306 344" fill="none" stroke="#C8B48C" stroke-width="1.4" stroke-dasharray="4 5" opacity=".9"/>

  <!-- 投影 -->
  <g clip-path="url(#castShadow)">
    <rect x="280" y="368" width="250" height="44" fill="url(#band3)"/>
    <rect x="300" y="376" width="200" height="30" fill="url(#band4)"/>
  </g>

  <!-- 标注 -->
  <g stroke="#B9A98F" stroke-width="1.1" stroke-dasharray="3 4" fill="none">
    <path d="M404 290 L446 296 L486 296"/>
    <path d="M420 400 L398 394 L388 388"/>
    <path d="M106 156 L196 192 L244 202"/>
    <path d="M316 406 L348 378 L366 342"/>
  </g>
  <circle cx="244" cy="202" r="3" fill="#A9553F"/>
  <circle cx="404" cy="290" r="3" fill="#A9553F"/>
  <circle cx="366" cy="342" r="3" fill="#A9553F"/>
  <circle cx="388" cy="388" r="3" fill="#A9553F"/>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#7A6E61">
    <text x="66" y="152">高光（最亮的一点）</text>
    <text x="492" y="305">明暗交界线（最暗）</text>
    <text x="462" y="406">投影</text>
    <text x="276" y="414">反光</text>
    <text x="96" y="390" font-family="Songti SC, STSong, serif" font-size="14" fill="#A98D6B">一个球，五种深浅。</text>
  </g>
</svg>
