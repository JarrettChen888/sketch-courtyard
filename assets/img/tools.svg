<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="t2">
  <title id="t2">示意图：桌面上摆着铅笔、橡皮、素描纸、美纹纸和削笔刀</title>
  <rect width="640" height="420" fill="#FBF6EC"/>
  <defs>
    <pattern id="toolHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#7A6E61" stroke-width=".9" opacity=".38"/>
    </pattern>
  </defs>

  <!-- 桌面线 -->
  <path d="M40 352 C160 345 320 358 600 350" fill="none" stroke="#D8C8AB" stroke-width="2" stroke-linecap="round"/>

  <!-- 素描纸 -->
  <g transform="rotate(-3 300 210)">
    <rect x="150" y="90" width="300" height="230" fill="#FFFDF8" stroke="#3B342C" stroke-width="2.2"/>
    <path d="M196 150 C240 132 292 146 336 138" fill="none" stroke="#8B7B66" stroke-width="1.3" opacity=".55"/>
    <path d="M190 190 C246 178 300 190 348 178" fill="none" stroke="#8B7B66" stroke-width="1.2" opacity=".45"/>
    <path d="M186 244 C230 226 268 240 300 230" fill="none" stroke="#8B7B66" stroke-width="1.2" opacity=".4"/>
    <!-- 美纹纸 -->
    <rect x="140" y="78" width="66" height="20" fill="#EBD9B4" fill-opacity=".85" stroke="#C8B48C" stroke-width="1" transform="rotate(-8 173 88)"/>
    <rect x="396" y="272" width="66" height="20" fill="#EBD9B4" fill-opacity=".85" stroke="#C8B48C" stroke-width="1" transform="rotate(6 429 282)"/>
  </g>

  <!-- 铅笔 2B -->
  <g transform="rotate(-14 520 300)">
    <rect x="404" y="292" width="200" height="15" rx="2" fill="#E9C97E" stroke="#3B342C" stroke-width="1.6"/>
    <path d="M604 292 L636 299.5 L604 307 Z" fill="#F3E3BC" stroke="#3B342C" stroke-width="1.6"/>
    <path d="M625 297.7 L636 299.5 L625 301.3 Z" fill="#3B342C"/>
    <path d="M404 299.5 L604 299.5" stroke="#B99A52" stroke-width="1.1"/>
    <text x="470" y="288" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5E5449">2B 打草稿</text>
  </g>
  <!-- 铅笔 4B -->
  <g transform="rotate(-6 520 340)">
    <rect x="430" y="332" width="170" height="15" rx="2" fill="#D4AF6A" stroke="#3B342C" stroke-width="1.6"/>
    <path d="M600 332 L630 339.5 L600 347 Z" fill="#F3E3BC" stroke="#3B342C" stroke-width="1.6"/>
    <path d="M620 337.6 L630 339.5 L620 341.4 Z" fill="#3B342C"/>
    <path d="M430 339.5 L600 339.5" stroke="#A98D4A" stroke-width="1.1"/>
    <text x="452" y="328" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5E5449">4B 画暗部</text>
  </g>

  <!-- 橡皮 -->
  <g transform="rotate(-8 130 330)">
    <rect x="76" y="308" width="112" height="44" rx="6" fill="#F2E8D2" stroke="#3B342C" stroke-width="1.8"/>
    <rect x="76" y="308" width="112" height="14" rx="6" fill="#D9C4A8" stroke="#3B342C" stroke-width="1.4"/>
    <text x="92" y="339" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5E5449">软橡皮</text>
  </g>

  <!-- 削笔刀 -->
  <g transform="translate(340 330)">
    <circle cx="0" cy="0" r="34" fill="#EFE4CC" stroke="#3B342C" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="20" fill="#FFFDF8" stroke="#3B342C" stroke-width="1.5"/>
    <rect x="-12" y="-26" width="24" height="12" rx="2" fill="#B9A98F" stroke="#3B342C" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="6" fill="#3B342C"/>
  </g>

  <!-- 标注 -->
  <g stroke="#B9A98F" stroke-width="1.1" stroke-dasharray="3 4" fill="none">
    <path d="M300 92 L300 62 L362 62"/>
    <path d="M196 322 L148 328"/>
    <path d="M352 362 L470 402 L520 402"/>
  </g>
  <circle cx="300" cy="92" r="3" fill="#A9553F"/>
  <circle cx="196" cy="322" r="3" fill="#A9553F"/>
  <circle cx="470" cy="360" r="3" fill="#A9553F"/>
  <text x="370" y="57" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5E5449">A4 纸，美纹纸固定四角</text>
  <text x="528" y="407" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5E5449">削笔刀</text>
  <text x="150" y="70" font-family="Songti SC, STSong, serif" font-size="16" fill="#7A5B44">桌面不大，够用就好</text>
</svg>
