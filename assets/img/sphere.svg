<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="t5">
  <title id="t5">示意图：左边的方框和十字线切出圆，右边的球体上画着结构椭圆、暗面和投影</title>
  <rect width="640" height="420" fill="#FBF6EC"/>
  <defs>
    <pattern id="sphereShadow" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7A6E61" stroke-width="1" opacity=".4"/>
    </pattern>
    <clipPath id="shadowE"><ellipse cx="440" cy="340" rx="112" ry="18"/></clipPath>
  </defs>

  <!-- 左：先方后圆 -->
  <g>
    <rect x="72" y="140" width="128" height="128" fill="none" stroke="#B9A98F" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path d="M72 204 H200" stroke="#D8C8AB" stroke-width="1.2" stroke-dasharray="4 5"/>
    <path d="M136 140 V268" stroke="#D8C8AB" stroke-width="1.2" stroke-dasharray="4 5"/>
    <circle cx="136" cy="204" r="64" fill="none" stroke="#3B342C" stroke-width="2.2"/>
    <circle cx="136" cy="204" r="64" fill="none" stroke="#A9553F" stroke-width="1" opacity=".5" stroke-dasharray="3 6"/>
    <path d="M92 170 C104 158 120 154 136 154" fill="none" stroke="#A9553F" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
    <text x="86" y="302" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#5E5449">先画方框和十字线，再切圆</text>
  </g>

  <!-- 光 -->
  <g>
    <path d="M312 74 L364 138" fill="none" stroke="#C8B48C" stroke-width="1.6" stroke-dasharray="4 4"/>
    <path d="M356 128 L364 138 L352 140" fill="none" stroke="#C8B48C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="290" y="64" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5E5449">光从这边来</text>
  </g>

  <!-- 球体 -->
  <g>
    <circle cx="420" cy="215" r="96" fill="#FFFDF8" stroke="#3B342C" stroke-width="2.3"/>
    <g fill="none" stroke="#B9A98F" stroke-width="1.3" stroke-dasharray="4 5">
      <ellipse cx="420" cy="174" rx="87" ry="11"/>
      <ellipse cx="420" cy="215" rx="96" ry="15"/>
      <ellipse cx="420" cy="256" rx="87" ry="12"/>
      <ellipse cx="420" cy="215" rx="26" ry="96"/>
    </g>
    <circle cx="420" cy="215" r="4" fill="#8B7B66"/>
    <!-- 暗面排线 -->
    <g fill="none" stroke="#5E5449" stroke-width="1.2" opacity=".7" stroke-linecap="round">
      <path d="M462 140 C496 170 512 202 510 238"/>
      <path d="M470 152 C502 182 516 214 512 248"/>
      <path d="M468 172 C498 200 512 230 508 260"/>
      <path d="M456 196 C484 222 498 250 494 278"/>
      <path d="M438 224 C462 248 474 274 470 298"/>
      <path d="M414 250 C436 272 446 294 444 310"/>
      <path d="M386 268 C404 288 414 304 414 316"/>
      <path d="M356 276 C372 292 380 304 382 314"/>
      <path d="M488 210 C512 236 520 260 516 282"/>
    </g>
    <path d="M456 170 C486 196 502 226 500 254" fill="none" stroke="#A9553F" stroke-width="1.4" stroke-dasharray="4 4" opacity=".65"/>
  </g>

  <!-- 投影 -->
  <g clip-path="url(#shadowE)"><rect x="320" y="320" width="240" height="40" fill="url(#sphereShadow)"/></g>

  <!-- 标注 -->
  <g stroke="#B9A98F" stroke-width="1.1" stroke-dasharray="3 4" fill="none">
    <path d="M532 208 L506 216 L476 224"/>
    <path d="M512 350 L496 320 L482 292"/>
    <path d="M356 396 L390 380 L420 348"/>
    <path d="M244 156 L320 156 L356 158"/>
  </g>
  <circle cx="476" cy="224" r="3" fill="#A9553F"/>
  <circle cx="482" cy="292" r="3" fill="#A9553F"/>
  <circle cx="420" cy="348" r="3" fill="#A9553F"/>
  <circle cx="356" cy="158" r="3" fill="#A9553F"/>
  <text x="540" y="204" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5E5449">暗面</text>
  <text x="520" y="356" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5E5449">椭圆结构线</text>
  <text x="300" y="404" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5E5449">投影</text>
  <text x="202" y="152" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5E5449">高光</text>
  <text x="62" y="80" font-family="Songti SC, STSong, serif" font-size="16" fill="#7A5B44">圆不是描出来的，是修出来的</text>
</svg>
