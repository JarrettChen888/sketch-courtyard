<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340" role="img" aria-labelledby="t10">
  <title id="t10">插画：放大镜照着搜索框和素描小画，示意在网上找教程和参考图</title>
  <defs>
    <pattern id="saHatch" width="5.5" height="5.5" patternUnits="userSpaceOnUse" patternTransform="rotate(42)">
      <line x1="0" y1="0" x2="0" y2="5.5" stroke="#46605C" stroke-width="1" opacity=".4"/>
    </pattern>
    <clipPath id="saLens"><circle cx="238" cy="126" r="72"/></clipPath>
  </defs>

  <!-- 搜索框 -->
  <g>
    <rect x="26" y="252" width="300" height="48" rx="24" fill="#FFFDF8" stroke="#46605C" stroke-width="2"/>
    <circle cx="54" cy="276" r="8" fill="none" stroke="#46605C" stroke-width="2"/>
    <path d="M60 282 L67 289" stroke="#46605C" stroke-width="2" stroke-linecap="round"/>
    <text x="78" y="282" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#46605C">素描 苹果 步骤</text>
    <path d="M306 268 L330 252" stroke="#A9553F" stroke-width="2" stroke-linecap="round"/>
    <path d="M306 284 L330 300" stroke="#A9553F" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 小标签 -->
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12">
    <rect x="332" y="104" width="62" height="26" rx="13" fill="#F6E7E1" stroke="#A9553F" stroke-width="1.3"/>
    <text x="343" y="121" fill="#A9553F">教程</text>
    <rect x="342" y="146" width="62" height="26" rx="13" fill="#F7EFDC" stroke="#C89B3C" stroke-width="1.3"/>
    <text x="353" y="163" fill="#9A7726">参考图</text>
    <rect x="326" y="188" width="78" height="26" rx="13" fill="#E8EEEA" stroke="#46605C" stroke-width="1.3"/>
    <text x="338" y="205" fill="#46605C">判断好坏</text>
  </g>

  <!-- 放大镜 -->
  <g>
    <circle cx="238" cy="126" r="78" fill="#FFFDF8" stroke="#2B2622" stroke-width="5"/>
    <circle cx="238" cy="126" r="72" fill="#FBF6EC"/>
    <!-- 镜片里的素描小画 -->
    <g clip-path="url(#saLens)">
      <g fill="none" stroke="#2B2622" stroke-width="2" stroke-linecap="round">
        <path d="M212 96 C186 92 168 108 166 130 C164 156 180 178 204 184 C220 188 234 180 246 180 C258 180 272 188 288 182 C310 174 322 152 316 130 C310 106 288 98 268 100 C254 102 244 106 234 98 C228 94 220 92 212 96 Z"/>
        <path d="M230 98 C228 84 232 72 242 64" stroke-width="2.4"/>
        <path d="M242 64 C254 56 270 56 278 62 C270 74 254 76 242 64 Z"/>
      </g>
      <g clip-path="url(#saLens)"></g>
      <rect x="246" y="96" width="90" height="96" fill="url(#saHatch)" opacity=".55"/>
      <rect x="150" y="70" width="120" height="120" fill="url(#saHatch)" opacity=".25"/>
    </g>
    <path d="M296 184 L344 234" stroke="#2B2622" stroke-width="11" stroke-linecap="round"/>
    <path d="M296 184 L344 234" stroke="#C89B3C" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 装饰线 -->
  <path d="M36 220 C70 206 110 214 140 204" fill="none" stroke="#C89B3C" stroke-width="2" stroke-linecap="round" opacity=".55"/>
  <path d="M40 120 C60 108 84 112 100 102" fill="none" stroke="#A9553F" stroke-width="2" stroke-linecap="round" opacity=".4"/>
  <text x="30" y="322" font-family="Songti SC, STSong, serif" font-size="13" fill="#46605C">自己找来的老师，永远在。</text>
</svg>
