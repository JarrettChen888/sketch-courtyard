<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="t8">
  <title id="t8">示意图：苹果和水杯摆在一起，标出构图框、结构辅助线、阴影和前后关系</title>
  <rect width="640" height="420" fill="#FBF6EC"/>
  <defs>
    <pattern id="slShadow" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7A6E61" stroke-width="1" opacity=".4"/>
    </pattern>
    <clipPath id="slShadowClip"><ellipse cx="300" cy="348" rx="176" ry="22"/></clipPath>
    <clipPath id="appleClip2"><path d="M256 236 C240 226 218 232 208 250 C196 272 200 302 216 320 C229 335 246 341 260 336 C267 334 272 330 278 331 C286 332 291 337 299 334 C316 327 325 307 323 284 C321 260 307 243 290 238 C280 235 270 237 263 242 C259 245 258 240 256 236 Z"/></clipPath>
  </defs>

  <!-- 画面框与三分线 -->
  <rect x="70" y="70" width="500" height="290" fill="none" stroke="#D8C8AB" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M236 70 V360" stroke="#EADFCB" stroke-width="1.2" stroke-dasharray="3 6"/>
  <path d="M403 70 V360" stroke="#EADFCB" stroke-width="1.2" stroke-dasharray="3 6"/>
  <path d="M70 167 H570" stroke="#EADFCB" stroke-width="1.2" stroke-dasharray="3 6"/>
  <path d="M70 263 H570" stroke="#EADFCB" stroke-width="1.2" stroke-dasharray="3 6"/>

  <!-- 光 -->
  <g>
    <path d="M108 104 L150 150" fill="none" stroke="#C8B48C" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M140 140 L150 150 L135 152" fill="none" stroke="#C8B48C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 投影：连成一片 -->
  <g clip-path="url(#slShadowClip)"><rect x="120" y="330" width="360" height="44" fill="url(#slShadow)"/></g>

  <!-- 水杯（后） -->
  <g>
    <ellipse cx="404" cy="196" rx="52" ry="13" fill="none" stroke="#8B7B66" stroke-width="1.6" stroke-dasharray="5 5"/>
    <path d="M352 196 L362 322 L446 322 L456 196" fill="none" stroke="#3B342C" stroke-width="2"/>
    <path d="M352 196 A52 13 0 0 1 456 196" fill="none" stroke="#3B342C" stroke-width="2"/>
    <path d="M456 218 C484 220 486 276 452 282" fill="none" stroke="#3B342C" stroke-width="2.6"/>
    <path d="M372 214 L380 318" stroke="#5E5449" stroke-width="1.1" opacity=".5"/>
    <path d="M392 216 L398 318" stroke="#5E5449" stroke-width="1.1" opacity=".5"/>
    <path d="M412 216 L414 318" stroke="#5E5449" stroke-width="1.1" opacity=".45"/>
  </g>

  <!-- 苹果（前）：结构线 -->
  <g>
    <path d="M264 210 V344" stroke="#B9A98F" stroke-width="1.2" stroke-dasharray="4 5"/>
    <ellipse cx="264" cy="286" rx="58" ry="58" fill="none" stroke="#D8C8AB" stroke-width="1.3" stroke-dasharray="5 5"/>
    <ellipse cx="264" cy="240" rx="34" ry="10" fill="none" stroke="#D8C8AB" stroke-width="1.2" stroke-dasharray="4 5"/>
  </g>
  <!-- 苹果轮廓 -->
  <path d="M256 236 C240 226 218 232 208 250 C196 272 200 302 216 320 C229 335 246 341 260 336 C267 334 272 330 278 331 C286 332 291 337 299 334 C316 327 325 307 323 284 C321 260 307 243 290 238 C280 235 270 237 263 242 C259 245 258 240 256 236 Z" fill="#FFFDF8" stroke="#3B342C" stroke-width="2.2"/>
  <!-- 苹果明暗 -->
  <g fill="none" stroke="#5E5449" stroke-width="1.15" opacity=".65" stroke-linecap="round">
    <path d="M292 244 C306 254 314 270 315 288"/>
    <path d="M298 250 C312 262 318 278 317 294"/>
    <path d="M300 262 C312 276 316 290 313 304"/>
    <path d="M294 276 C304 290 308 302 305 314"/>
    <path d="M282 290 C290 304 292 314 288 324"/>
    <path d="M264 300 C270 312 270 322 266 330"/>
    <path d="M240 300 C246 312 248 322 244 330"/>
    <path d="M220 288 C226 302 228 314 224 324"/>
    <path d="M210 268 C216 282 218 294 214 304"/>
    <path d="M210 250 C216 262 218 274 214 284"/>
    <path d="M270 240 C282 234 294 236 304 242"/>
  </g>
  <path d="M263 242 C260 224 265 210 275 200" fill="none" stroke="#3B342C" stroke-width="2.6"/>
  <path d="M275 200 C288 190 306 190 316 198 C306 212 288 214 275 200 Z" fill="#F3E8D2" stroke="#3B342C" stroke-width="1.8"/>

  <!-- 标注 -->
  <g stroke="#B9A98F" stroke-width="1.1" stroke-dasharray="3 4" fill="none">
    <path d="M300 172 L332 152 L402 144"/>
    <path d="M300 366 L364 388 L448 388"/>
    <path d="M470 250 L502 250"/>
  </g>
  <circle cx="300" cy="172" r="3" fill="#A9553F"/>
  <circle cx="300" cy="366" r="3" fill="#A9553F"/>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5E5449">
    <text x="408" y="139">苹果在前，杯子在后</text>
    <text x="420" y="393">阴影连成一片，画面才稳</text>
    <text x="466" y="255">把东西放在中间偏下</text>
  </g>
  <text x="70" y="52" font-family="Songti SC, STSong, serif" font-size="16" fill="#7A5B44">先定位置，再画细节</text>
</svg>
