<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="t4">
  <title id="t4">示意图：两点透视的方块，标出消失点和看不见的边</title>
  <rect width="640" height="420" fill="#FBF6EC"/>
  <defs>
    <pattern id="cubeHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(52)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#7A6E61" stroke-width="1" opacity=".4"/>
    </pattern>
    <clipPath id="leftFace"><path d="M310 140 L200 168 L200 257 L310 290 Z"/></clipPath>
  </defs>

  <!-- 视平线 -->
  <path d="M28 210 L612 210" stroke="#C8B48C" stroke-width="1.3" stroke-dasharray="6 6"/>
  <text x="508" y="202" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5E5449">视平线</text>

  <!-- 消失点 -->
  <circle cx="40" cy="210" r="4" fill="#A9553F"/>
  <circle cx="600" cy="210" r="4" fill="#A9553F"/>
  <text x="14" y="236" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#A9553F">消失点</text>
  <text x="540" y="236" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#A9553F">消失点</text>

  <!-- 延长到消失点的辅助线 -->
  <g fill="none" stroke="#B9A98F" stroke-width="1.1" stroke-dasharray="4 5" opacity=".9">
    <path d="M310 140 L40 210"/>
    <path d="M310 140 L600 210"/>
    <path d="M200 168 L600 210"/>
    <path d="M430 169 L40 210"/>
    <path d="M310 290 L40 210"/>
    <path d="M310 290 L600 210"/>
  </g>

  <!-- 看不见的边：虚线 -->
  <g fill="none" stroke="#8B7B66" stroke-width="1.4" stroke-dasharray="5 5">
    <path d="M200 168 L323 181 L430 169"/>
    <path d="M323 181 L316 243"/>
    <path d="M200 257 L316 243 L430 257"/>
  </g>

  <!-- 左面淡排线 -->
  <g clip-path="url(#leftFace)"><rect x="190" y="130" width="130" height="170" fill="url(#cubeHatch)"/></g>

  <!-- 看得见的边：实线 -->
  <g fill="none" stroke="#3B342C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M310 140 L200 168 L200 257 L310 290 Z"/>
    <path d="M310 140 L430 169 L430 257 L310 290"/>
    <path d="M200 168 L430 169"/>
    <path d="M200 257 L430 257"/>
  </g>

  <!-- 标注 -->
  <g stroke="#B9A98F" stroke-width="1.1" stroke-dasharray="3 4" fill="none">
    <path d="M262 233 L262 300 L196 332"/>
    <path d="M355 190 L380 116 L470 116"/>
  </g>
  <circle cx="262" cy="233" r="3" fill="#A9553F"/>
  <circle cx="355" cy="190" r="3" fill="#A9553F"/>
  <text x="88" y="360" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5E5449">看不见的边，先画虚线</text>
  <text x="480" y="112" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#5E5449">三条线交于一点</text>

  <text x="56" y="60" font-family="Songti SC, STSong, serif" font-size="16" fill="#7A5B44">方块是所有形体的骨头</text>
</svg>
